[project]
name = "interplant-specs"
version = "0.1.0"
description = "INTERPLANT spec documents and validation suite"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "referencing>=0.35",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
