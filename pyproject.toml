[project]
name = "interplant-specs"
version = "0.1.0"
description = "INTERPLANT spec documents and validation suite"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "referencing>=0.35",
  "rfc3339-validator>=0.1",
  "arctrl>=2.0",
  "httpx>=0.27",
  "flask>=3.1.3",
  "gunicorn>=26.0.0",
  "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
  "lxml>=6.1.1",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "db: requires a running Postgres (gated by INTERPLANT_STACK_TESTS=1)",
    "live: requires live network (gated by INTERPLANT_LIVE_HARVEST=1)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["research/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ships to AWI's harvester fleet; their house style (.format, single quotes,
# no type hints) is deliberate. See portal/README.md.
"portal/*.py" = ["UP"]
