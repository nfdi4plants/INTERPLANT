  arc-locations:
    type: collection
    title: INTERPLANT ARC locations
    description: 'One point per extracted or derived ARC location. Where a Records entry
  
      carries a single representative geometry, this collection carries every
  
      point behind it, each tagged with its role and the precision of its
  
      derivation: a single study''s collection sites can appear here as hundreds
  
      of separate points.
  
  
      This is a derived query surface, not a catalogue. Two consequences a client
  
      needs to know. First, feature ids are NOT durable: an id has the form
  
      "<record id>:<ordinal>", the ordinal comes from the order locations were
  
      emitted in, and the view is rebuilt after every nightly harvest, so a given
  
      id can refer to a different point tomorrow. Do not cite, bookmark or cache
  
      a feature URL from this collection - cite the arc-records entry instead and
  
      reach its points via ?record_id=. Second, the collection covers only the
  
      minority of ARCs that carry any location at all, and is heavily skewed
  
      towards the few that carry many, so an empty result for a bounding box does
  
      not mean the region has no research data - query arc-records for that.'
    keywords:
    - locations
    - geospatial
    - arc
    - dataplant
    extents:
      spatial:
        bbox:
        - -180
        - -90
        - 180
        - 90
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    links: []
    providers:
    - type: feature
      name: PostgreSQL
      data:
        host: ${INTERPLANT_PG_HOST:-db}
        port: ${INTERPLANT_PG_PORT:-5432}
        dbname: ${INTERPLANT_PG_DBNAME:-interplant}
        user: ${INTERPLANT_PG_USER:-interplant}
        password: ${INTERPLANT_PG_PASSWORD:-interplant}
      id_field: id
      table: arc_locations
      geom_field: geom
      time_field: created
      properties:
      - record_id
      - created
      - role
      - label
      - precision
      - n_rows
      - source
