resources:
  arc-records:
    type: collection
    title: INTERPLANT ARC records
    description: All harvested DataPLANT ARC metadata records.
    keywords:
      - arc
      - dataplant
      - records
    extents:
      spatial:
        bbox: [-180, -90, 180, 90]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    links:
      - type: text/html
        rel: canonical
        title: DataPLANT
        href: https://www.nfdi4plants.org/
    providers:
      - type: record
        name: PostgreSQL
        data:
          host: ${INTERPLANT_PG_HOST:-db}
          port: ${INTERPLANT_PG_PORT:-5432}
          dbname: ${INTERPLANT_PG_DBNAME:-interplant}
          user: ${INTERPLANT_PG_USER:-interplant}
          password: ${INTERPLANT_PG_PASSWORD:-interplant}
        id_field: id
        table: arc_records
        geom_field: geom
        # Required for ?datetime=. Undeclared, pygeoapi's SQL provider raises
        # ProviderQueryError and the API turns that into a 500 on a legal request.
        time_field: created
        properties:
          - title
          - description
          - created
          - omics_domains
          - experiment_context
          - organism
          - keywords
          - arc_source_uri
