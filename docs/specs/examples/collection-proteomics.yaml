id: dataplant-proteomics
title: DataPLANT Proteomics
description: |
  ARCs that contain at least one proteomics assay. Covers LC-MS/MS (DDA/DIA),
  label-free quantification, TurboID proximity labelling, and co-immunoprecipitation
  studies across plant and photosynthetic microbial species.
