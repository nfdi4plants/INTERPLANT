# Controlled vocabularies referenced by the record and collection schemas.
# Update only via PR. The harvester validates known terms and logs unknowns.

# Referenced by: schemas/record.schema.json (Properties.omics_domains and AssayCore.domain).
omics_domain_keywords:
  transcriptomics:   [rna-seq, rnaseq, transcriptomics, miRNA, scRNA, isoseq]
  genomics:          [wgs, chip-seq, dap-seq, atac-seq, hi-c, genome-assembly, annotation, gwas]
  proteomics:        [lc-ms, dda, dia, turboid, co-ip, mass-spec, proteomics]
  metabolomics:      [gc-ms, gc-qtof, masshunter, metabolomics, lc-ms-metabolites]
  phenotyping:       [phenotyping, field-trial, growth, miappe, observation-unit]
  imaging:           [clsm, microscopy, light-sheet, mri, drone, ir-imaging, spinning-disk]
  microbiome:        [16s, 18s, metabarcoding, metagenomics, phage]

library_strategy:    [RNA-Seq, miRNA-Seq, scRNA-Seq, WGS, ChIP-Seq, DAP-Seq, Hi-C, ATAC-Seq, AMPLICON, Other]
platform:            [ILLUMINA, OXFORD_NANOPORE, PACBIO_SMRT, OTHER]
acquisition_mode:    [DDA, DIA, SRM, PRM, other]
chromatography:      [GC, LC-RP, LC-HILIC, other]
ion_mode:            [positive, negative]
trait_category:      [morphological, physiological, yield, resistance]
image_format:        [TIFF, CZI, LIF, ND2, other]
target_gene:         [16S, 18S, ITS, other]

experiment_context:  [field, greenhouse, lab, mixed]

# GROWTH FACILITY string → experiment_context (case-insensitive substring match)
growth_facility_map:
  field:      [field, open-field, research-farm, trial-site]
  greenhouse: [greenhouse, glasshouse, polytunnel, gh]
  lab:        [growth-chamber, climate-chamber, incubator, petri, bioreactor]
