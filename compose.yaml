services:
  db:
    image: postgis/postgis:17-3.6-alpine
    container_name: interplant-db
    environment:
      POSTGRES_USER: interplant
      POSTGRES_PASSWORD: interplant
      POSTGRES_DB: interplant
    ports:
      - "5432:5432"
    volumes:
      - interplant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interplant -d interplant"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  catalog-init:
    image: postgis/postgis:17-3.6-alpine
    container_name: interplant-catalog-init
    environment:
      PGPASSWORD: interplant
      # Role applied with the same password the stack tests use
      # (tests/stack/conftest.py RO_PASSWORD), so dev and the role tests agree.
      # A shell env override wins; plain `docker compose up` gets the test one.
      INTERPLANT_PG_RO_PASSWORD: ${INTERPLANT_PG_RO_PASSWORD:-test-ro-password}
    volumes:
      - ./harvester/schema.sql:/sql/00_schema.sql:ro
      - ./sql/catalog_views.sql:/sql/10_views.sql:ro
      - ./sql/catalog_collections.generated.sql:/sql/20_generated.sql:ro
      - ./sql/pygeoapi_role.sql:/sql/30_role.sql:ro
    entrypoint:
      - sh
      - -c
      - >
        psql -h db -U interplant -d interplant -v ON_ERROR_STOP=1 -f /sql/00_schema.sql &&
        psql -h db -U interplant -d interplant -v ON_ERROR_STOP=1 -f /sql/10_views.sql &&
        psql -h db -U interplant -d interplant -v ON_ERROR_STOP=1 -f /sql/20_generated.sql &&
        psql -h db -U interplant -d interplant -v ON_ERROR_STOP=1 -f /sql/30_role.sql &&
        psql -h db -U interplant -d interplant -v ON_ERROR_STOP=1 -c "ALTER ROLE pygeoapi_ro WITH PASSWORD '${INTERPLANT_PG_RO_PASSWORD:-test-ro-password}'"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  pygeoapi:
    image: geopython/pygeoapi:0.23.4
    container_name: interplant-pygeoapi
    environment:
      # Set explicitly rather than relying on the config defaults, so dev
      # exercises the same override path production uses. A placeholder that
      # stopped expanding would otherwise still appear to work here. Dev runs
      # as the same read-only identity production uses (pygeoapi_ro), so a
      # missing grant fails the stack tests instead of rotting in silence.
      INTERPLANT_PG_HOST: db
      INTERPLANT_PG_USER: pygeoapi_ro
      INTERPLANT_PG_PASSWORD: test-ro-password
      INTERPLANT_OGC_BASE_URL: http://localhost:5000
    ports:
      - "5000:80"
    volumes:
      - ./pygeoapi-config.yml:/pygeoapi/local.config.yml:ro
    depends_on:
      db:
        condition: service_healthy
      catalog-init:
        condition: service_completed_successfully
    restart: unless-stopped

  oai:
    build:
      context: .
      dockerfile: oai/Dockerfile
    container_name: interplant-oai
    environment:
      INTERPLANT_DSN: postgresql://interplant:interplant@db:5432/interplant
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  interplant_pgdata:
