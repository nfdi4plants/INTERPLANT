default:
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
    - uv sync --dev --frozen

stages:
  - lint
  - test

lint:
  stage: lint
  script:
    - uv run ruff check .

test:
  stage: test
  services:
    - name: postgis/postgis:17-3.6-alpine
      alias: db
  variables:
    POSTGRES_USER: interplant
    POSTGRES_PASSWORD: interplant
    POSTGRES_DB: interplant
    INTERPLANT_PG_DSN: "postgresql://interplant:interplant@db:5432/interplant"
    INTERPLANT_STACK_TESTS: "1"
  script:
    - uv run pytest -v

harvest-nightly:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  allow_failure: true
  variables:
    INTERPLANT_LIVE_HARVEST: "1"
  script:
    # --parse-timeout is mandatory here: arctrl can spend tens of minutes on a
    # single assay-heavy ARC, which would burn the job's wall clock and produce
    # no artifact at all. Bounded, those ARCs land in the report as failures.
    - uv run python -m harvester harvest --source live --dry-run --parse-timeout 300 --out-dir artifacts/
  artifacts:
    paths:
      - artifacts/
    when: always
