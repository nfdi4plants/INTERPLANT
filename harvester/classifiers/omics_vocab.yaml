# Omics-domain classifier vocabulary. Single source of truth.
# Every `domain` value MUST be one of the 8 schema-enum values:
#   transcriptomics, genomics, proteomics, metabolomics,
#   phenotyping, imaging, microbiome, other
# Folding policy: lipidomics -> metabolomics; epigenomics/ChIP/ATAC -> genomics.
# Within each list, first match wins. Order across lists is fixed in code:
# measurement_type_rules, technology_type_rules, technology_platform_rules, rules.

# measurement_type (richest signal). Microbiome first so 16S/18S/amplicon win
# before transcriptomics ("...RNA") or genomics ("metagenom" contains "genom").
measurement_type_rules:
  - pattern: '(?i)(metabarcod|metagenom|amplicon|\b16s\b|\b18s\b|\bits[12]?\b|microbiom|phage)'
    domain:  microbiome
  - pattern: '(?i)(transcript|rna[\s\-_]?seq|mirna|scrna|isoseq)'
    domain:  transcriptomics
  - pattern: '(?i)(proteom|\bprotein\b|protein structure|turboid|co[\s\-_]?ip|\bdda\b|\bdia\b)'
    domain:  proteomics
  - pattern: '(?i)(lipidom|metabolit|metabolom|\bgc[\s\-_]?ms\b|maldi)'
    domain:  metabolomics
  - pattern: '(?i)(genom|genotyp|\bwgs\b|wgbs|chip[\s\-_]?seq|atac[\s\-_]?seq|dap[\s\-_]?seq|\bhi[\s\-_]?c\b|dna sequencing|epigenom|methylat)'
    domain:  genomics
  - pattern: '(?i)(phenotyp|morpholog|\btrait|\bgrowth|miappe|observation[\s\-_]?unit|field[\s\-_]?trial)'
    domain:  phenotyping
  - pattern: '(?i)(imaging|microsc)'
    domain:  imaging

# technology_type (method-level; often domain-bearing).
# Proteomics/metabolomics/microbiome are intentionally omitted here: their
# technology_type strings (e.g. "mass spectrometry") are ambiguous, so those
# domains are resolved via measurement_type or folder name instead.
technology_type_rules:
  - pattern: '(?i)(rna[\s\-_]?seq|transcript)'
    domain:  transcriptomics
  - pattern: '(?i)(dna microarray|nucleotide sequencing|dna sequencing|exome|\bwgs\b)'
    domain:  genomics
  - pattern: '(?i)(microsc|imaging)'
    domain:  imaging

# technology_platform (instrument model). ONLY unambiguous instruments.
# Sequencers and generic mass specs are deliberately omitted: they are shared
# across domains and must defer to measurement_type / folder.
technology_platform_rules:
  - pattern: '(?i)(\blsm\b|confocal|light[\s\-_]?sheet|spinning[\s\-_]?disk|\bsem\b|\btem\b)'
    domain:  imaging

# folder name (last-resort fallback). Microbiome precedes the genomics rules so
# "metagenom" (which contains "genom") is not misrouted to genomics.
rules:
  - pattern: '(?i)rna[\s\-_]?seq'
    domain:  transcriptomics
  - pattern: '(?i)(16s|18s|metabarcod|metagenom|amplicon|microbiom)'
    domain:  microbiome
  - pattern: '(?i)(chip[\s\-_]?seq|atac[\s\-_]?seq|dap[\s\-_]?seq|\bhi[\s\-_]?c\b)'
    domain:  genomics
  - pattern: '(?i)(\bwgs\b|wgbs|genom|genotyp)'
    domain:  genomics
  - pattern: '(?i)(lc[\s\-_]?ms.*protein|protein.*lc[\s\-_]?ms|proteom|turboid|co[\s\-_]?ip)'
    domain:  proteomics
  - pattern: '(?i)(lipidom|lc[\s\-_]?ms.*metabol|metabol.*lc[\s\-_]?ms|metabolom|gc[\s\-_]?ms|maldi)'
    domain:  metabolomics
  - pattern: '(?i)(phenotyp|imaging.*plant|growth.*chamber|field[\s\-_]?trial)'
    domain:  phenotyping
  - pattern: '(?i)(clsm|microsc|light[\s\-_]?sheet|confocal|drone|ir[\s\-_]?imaging)'
    domain:  imaging
